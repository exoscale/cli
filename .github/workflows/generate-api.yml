name: Regenerate API commands

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: master

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: Regenerate API commands
        run: make x-cmd

      - name: Verify generated commands
        run: make build test-verbose

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          commit-message: "api: regenerate commands"
          title: "api: regenerate commands"
          body: "The public API specification changed, so the generated `exo api` commands have been updated."
          branch: generate-exo-api
          base: master
          delete-branch: true
