name: golangci-lint

on:
  pull_request:

jobs:
  golangci-lint:
      name: lint
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7.0.1
        - name: Setup Go
          uses: actions/setup-go@v7.0.0
          with:
            go-version-file: go.mod
        - uses: golangci/golangci-lint-action@v9.3.0
          with:
            version: v2.15.0
            install-mode: binary
            args: --timeout 4m
            only-new-issues: true
