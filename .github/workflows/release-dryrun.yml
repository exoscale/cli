name: release-dryrun

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  goreleaser-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/build

      # Needed for multiarch OCI builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Compute goreleaser cache key
        id: goreleaser-cache-key
        run: echo "GORELEASER_CACHE_KEY=$(make --just-print install-goreleaser | tr --delete [:space:] | base32 --wrap 0)" >> "$GITHUB_OUTPUT"

      - name: Cache goreleaser
        id: cache-goreleaser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/go/bin/goreleaser
          key: ${{ steps.goreleaser-cache-key.outputs.GORELEASER_CACHE_KEY }}

      - name: Install goreleaser
        if: steps.cache-goreleaser.outputs.cache-hit != 'true'
        run: make install-goreleaser

      - run: echo "$(go env GOPATH)/bin/" >> "$GITHUB_PATH"

      - name: Release (snapshot, no publish, no signing)
        run: make release GORELEASER_OPTS="--clean --snapshot --skip=sign"

      - name: List built images
        run: docker images exoscale/cli

      - name: Smoke test images
        run: |
          docker run --rm --platform linux/amd64 exoscale/cli:latest-amd64 version
          docker run --rm --platform linux/arm64 exoscale/cli:latest-arm64 version
