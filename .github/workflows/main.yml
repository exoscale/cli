name: CI

on:
  push:
    branches:
    - 'master'
    paths-ignore:
    - '**.md'
    - 'bucket/**'
    tags-ignore:
    - 'v*' # Don't run CI tests on release tags
  pull_request:
    paths-ignore:
    - '**.md'
    - 'bucket/**'

jobs:
  build:
    name: Build + Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/build
