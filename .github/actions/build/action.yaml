name: "Build"
description: "Build and test the CLI"
runs:
  using: "composite"
  steps:
    - run: make go.mk
      shell: bash

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod

    - run: make pre-check
      shell: bash

    - run: make build
      shell: bash

    - run: make test-verbose
      shell: bash
