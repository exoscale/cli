name: "Build"
description: "Build and test the CLI"
runs:
  using: "composite"
  steps:
    - run: make go.mk
      shell: bash

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - uses: ./go.mk/.github/actions/pre-check

    - run: make build
      shell: bash

    - run: make test-verbose
      shell: bash
